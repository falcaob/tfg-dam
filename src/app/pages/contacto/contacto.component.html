<div class="page-content">
    <h2 class="text-2xl mb-4">Formulario de contacto</h2>

    <p-toast></p-toast>

    <div class="p-fluid p-formgrid grid">
        <div class="field col-12 md:col-6">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" pInputText [(ngModel)]="form.nombre" />
        </div>

        <div class="field col-12 md:col-6">
            <label for="telefono">Teléfono</label>
            <p-inputNumber inputId="telefono" [(ngModel)]="form.telefono" [useGrouping]="false" />
        </div>

        <div class="field col-12">
            <label for="comunidad">Comunidad Autónoma</label>
            <p-cascadeSelect options="comunidades" optionLabel="name" optionGroupLabel="name"
                [optionGroupChildren]="'provincias'" placeholder="Selecciona una comunidad"
                [(ngModel)]="form.comunidad" />
        </div>

        <div class="field col-12">
            <label for="mensaje">Mensaje</label>
            <p-editor [(ngModel)]="form.mensaje" [style]="{ height: '150px' }"></p-editor>
        </div>

        <div class="field col-12 flex justify-content-end">
            <p-button label="Enviar" icon="pi pi-send" (onClick)="enviarFormulario()" />
        </div>
    </div>

</div>
